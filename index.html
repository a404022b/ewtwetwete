<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>AR 明信片即時調參 v9.6 iPhone船修正版</title>

<script>
(() => {
  const gum = navigator.mediaDevices?.getUserMedia?.bind(navigator.mediaDevices);
  if (!gum) return;
  navigator.mediaDevices.getUserMedia = async (constraints={}) => {
    const c = JSON.parse(JSON.stringify(constraints || {}));
    const b = (typeof c.video === "object" && c.video) ? c.video : {};
    c.video = {
      ...b,
      facingMode: b.facingMode || {ideal:"environment"},
      width:{ideal:1920},
      height:{ideal:1080},
      frameRate:{ideal:30,max:30}
    };
    return gum(c);
  };
})();
</script>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,"Microsoft JhengHei",sans-serif}
#home{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:#efe7d9}
.panel{width:min(430px,100%);text-align:center;color:#2f281d}
.panel p{line-height:1.55}
button{border:0;border-radius:12px;min-height:46px;padding:0 16px;font-size:17px;font-weight:700}
#startBtn{width:100%;background:#2f281d;color:#fff}
#arRoot{position:fixed;inset:0;opacity:0;pointer-events:none;background:#000}
body.scanning #home{display:none}
body.scanning #arRoot{opacity:1;pointer-events:auto;z-index:1500}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1500}
body.scanning video,body.scanning canvas{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important}

#hud{display:none;position:fixed;z-index:3000;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));pointer-events:none}
body.scanning #hud{display:block}
#status,#camInfo{margin:0 auto 6px;max-width:520px;padding:8px 10px;border-radius:11px;background:rgba(0,0,0,.62);color:#fff;text-align:center}
#camInfo{font-size:12px}
#stopBtn,#tunerToggle{display:none;position:fixed;bottom:max(12px,env(safe-area-inset-bottom));z-index:3300;background:rgba(20,20,20,.85);color:#fff;border:1px solid rgba(255,255,255,.5)}
#stopBtn{right:12px}
#explainBtn{display:none;position:fixed;top:max(94px,calc(env(safe-area-inset-top) + 84px));right:12px;z-index:3300;background:rgba(20,20,20,.78);color:#fff;border:1px solid rgba(255,255,255,.45);min-height:40px;padding:0 14px;font-size:15px}
body.scanning #explainBtn{display:block}
#creditsOverlay{display:none;position:fixed;z-index:3350;left:12px;right:12px;bottom:82px;height:220px;overflow:hidden;border-radius:14px;background:rgba(10,10,10,.48);backdrop-filter:blur(5px);pointer-events:none}
#creditsOverlay.show{display:block}
#creditsOverlayInner{position:relative;height:100%;padding:16px;overflow:hidden}
#creditsOverlayText{white-space:pre-wrap;line-height:1.65;text-align:left;will-change:transform}

#tunerToggle{left:12px}
body.scanning #stopBtn,body.scanning #tunerToggle{display:block}

#tuner{display:none;position:fixed;z-index:3250;left:10px;right:10px;bottom:72px;max-height:60vh;overflow:auto;background:rgba(12,12,12,.91);color:#fff;border-radius:14px;padding:12px;backdrop-filter:blur(8px)}
#tuner.open{display:block}
.group{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.16)}
.group:last-child{border-bottom:0}
.group h3{margin:0 0 8px;font-size:15px}
.row{display:grid;grid-template-columns:116px 1fr 60px;gap:8px;align-items:center;margin:7px 0}
.row label{font-size:13px}
.row input[type=range]{width:100%}
.val{font-size:12px;text-align:right;opacity:.9}
.checkboxRow{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px}
#snapshot{width:100%;margin-top:6px;background:#fff;color:#111}
#values{width:100%;min-height:120px;margin-top:8px;resize:none;border-radius:10px;padding:8px;font-family:monospace;font-size:12px;background:#181818;color:#d9f6df;border:1px solid rgba(255,255,255,.2)}
#targetLoading{display:none;position:fixed;z-index:3400;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
#targetLoading.show{display:block}
.spinner{width:46px;height:46px;border:5px solid rgba(255,255,255,.30);border-top-color:#fff;border-radius:50%;animation:spin .72s linear infinite;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
@keyframes spin{to{transform:rotate(360deg)}}
.textInputRow{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0 10px}
.textInputRow input{min-width:0;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:9px 10px;font-size:16px}
.textInputRow button{min-height:40px;padding:0 12px;font-size:15px}
.selectRow{display:grid;grid-template-columns:116px 1fr;gap:8px;align-items:center;margin:7px 0}
.selectRow select{width:100%;padding:7px 8px;border-radius:8px;font-size:14px}
.textAreaRow textarea{
  width:100%;
  min-height:92px;
  resize:vertical;
  border:1px solid rgba(255,255,255,.25);
  border-radius:9px;
  padding:9px 10px;
  font-size:15px;
  line-height:1.45;
}
.colorRow{display:grid;grid-template-columns:116px 1fr 60px;gap:8px;align-items:center;margin:7px 0}
.colorRow input[type=color]{width:100%;height:34px;border:0;border-radius:8px;background:transparent;padding:0}


</style>

<script>
AFRAME.registerShader('video-grade',{
  schema:{
    src:{type:'map',is:'uniform'},
    brightness:{type:'number',is:'uniform',default:1.0},
    contrast:{type:'number',is:'uniform',default:1.0},
    opacity:{type:'number',is:'uniform',default:1.0}
  },
  vertexShader:`
    varying vec2 vUV;
    void main(){
      vUV=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform sampler2D src;
    uniform float brightness;
    uniform float contrast;
    uniform float opacity;
    varying vec2 vUV;
    void main(){
      vec4 c=texture2D(src,vUV);
      c.rgb=(c.rgb-0.5)*contrast+0.5;
      c.rgb*=brightness;
      float a=c.a*opacity;
      if(a<0.10) discard;
      gl_FragColor=vec4(c.rgb,a);
    }
  `
});


AFRAME.registerShader('video-grade-key',{
  schema:{
    src:{type:'map',is:'uniform'},
    brightness:{type:'number',is:'uniform',default:1.0},
    contrast:{type:'number',is:'uniform',default:1.0},
    opacity:{type:'number',is:'uniform',default:1.0},
    similarity:{type:'number',is:'uniform',default:0.14},
    smoothness:{type:'number',is:'uniform',default:0.11}
  },
  vertexShader:`
    varying vec2 vUV;
    void main(){
      vUV=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform sampler2D src;
    uniform float brightness;
    uniform float contrast;
    uniform float opacity;
    uniform float similarity;
    uniform float smoothness;
    varying vec2 vUV;

    void main(){
      vec4 c=texture2D(src,vUV);

      // Source boat.mp4 blue screen is approximately #4967B0.
      vec3 key=vec3(73.0/255.0,103.0/255.0,176.0/255.0);
      float d=distance(c.rgb,key);
      float a=smoothstep(similarity,similarity+smoothness,d);

      // Reduce blue spill on semi-transparent edge pixels.
      float spill=(1.0-a)*0.45;
      c.b=max(0.0,c.b-spill);
      c.rgb=(c.rgb-0.5)*contrast+0.5;
      c.rgb*=brightness;

      a*=opacity;
      if(a<0.025) discard;
      gl_FragColor=vec4(c.rgb,a);
    }
  `
});

AFRAME.registerShader('soft-irregular-bg',{
  schema:{
    src:{type:'map',is:'uniform'},
    color:{type:'color',is:'uniform',default:'#f3e6cf'},
    opacity:{type:'number',is:'uniform',default:0.35},
    feather:{type:'number',is:'uniform',default:0.08},
    irregular:{type:'number',is:'uniform',default:0.05},
    textured:{type:'number',is:'uniform',default:0.0}
  },
  vertexShader:`
    varying vec2 vUV;
    void main(){
      vUV=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform sampler2D src;
    uniform vec3 color;
    uniform float opacity;
    uniform float feather;
    uniform float irregular;
    uniform float textured;
    varying vec2 vUV;

    void main(){
      vec4 tex=texture2D(src,vUV);
      vec3 rgb=mix(color,tex.rgb,step(0.5,textured));
      float srcA=mix(1.0,tex.a,step(0.5,textured));

      float edge=min(min(vUV.x,1.0-vUV.x),min(vUV.y,1.0-vUV.y));
      float wobble=(sin(vUV.x*31.0)+sin(vUV.y*27.0)+sin((vUV.x+vUV.y)*19.0))*0.333333;
      float jitter=wobble*irregular;
      float f=max(feather,0.001);
      float mask=smoothstep(0.0,f,edge+jitter);

      gl_FragColor=vec4(rgb,srcA*opacity*mask);
    }
  `
});



AFRAME.registerShader('soft-irregular-water',{
  schema:{
    src:{type:'map',is:'uniform'},
    opacity:{type:'number',is:'uniform',default:0.34},
    feather:{type:'number',is:'uniform',default:0.10},
    irregular:{type:'number',is:'uniform',default:0.035}
  },
  vertexShader:`
    varying vec2 vUV;
    void main(){
      vUV=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform sampler2D src;
    uniform float opacity;
    uniform float feather;
    uniform float irregular;
    varying vec2 vUV;
    void main(){
      vec4 tex=texture2D(src,vUV);
      float edge=min(min(vUV.x,1.0-vUV.x),min(vUV.y,1.0-vUV.y));
      float wobble=(sin(vUV.x*23.0)+sin(vUV.y*19.0)+sin((vUV.x+vUV.y)*13.0))*0.333333;
      float mask=smoothstep(0.0,max(feather,0.001),edge+wobble*irregular);
      float a=tex.a*opacity*mask;
      if(a<0.015) discard;
      gl_FragColor=vec4(tex.rgb,a);
    }
  `
});

AFRAME.registerComponent('water-gentle-motion',{
  init(){
    this.baseX=0;
    this.baseY=0;
  },
  tick(t){
    const cfg=window.ARCFG;
    if(!cfg || !cfg.water || !cfg.water.enabled) return;

    // Very light movement only: no custom shader, so camera startup stays stable.
    const a=cfg.water.flowAmp;
    const s=cfg.water.flowSpeed;
    this.el.object3D.position.x = Math.sin(t*0.0007*s) * a;
    this.el.object3D.position.y = cfg.water.y + Math.cos(t*0.00055*s) * a*0.25;

    const pulse = 1 + Math.sin(t*0.0011*s) * cfg.water.scalePulse;
    this.el.object3D.scale.set(pulse,pulse,1);

    const mesh=this.el.getObject3D('mesh');
    if(mesh && mesh.material){
      mesh.material.opacity = cfg.water.opacity * (0.96 + 0.04*Math.sin(t*0.0013*s));
      mesh.material.transparent = true;
    }
  }
});

AFRAME.registerComponent('cloud-drift-fade',{
  schema:{idx:{type:'int',default:1}},
  init(){this.phase=(this.data.idx-1)*0.31},
  tick(t){
    const cfg=window.ARCFG;if(!cfg)return;
    const i=this.data.idx-1,c=cfg.clouds[i];
    const duration=26000/Math.max(0.1,cfg.cloudSpeed);
    const q=((t/duration)+this.phase)%1;
    const x=c.x-c.span/2+q*c.span;
    this.el.object3D.position.set(x,c.y,c.z);
    this.el.object3D.scale.set(c.scale,c.scale,1);

    const fade=Math.sin(t*c.fadeFreq + this.phase)*0.5+0.5;
    const opacity=Math.max(0,Math.min(1,c.opacity - c.fadeRange/2 + fade*c.fadeRange));
    const m=this.el.getObject3D('mesh');
    if(m?.material){m.material.transparent=true;m.material.opacity=opacity}
  }
});

AFRAME.registerComponent('boat-motion',{
  schema:{idx:{type:'int',default:1}},
  init(){this.lastWake=0;this.wakeRoot=document.querySelector('#wakeRoot'+this.data.idx)},
  tick(t){
    const cfg=window.ARCFG;if(!cfg)return;
    const b=cfg.boats[this.data.idx-1];
    if(!b.enabled){this.el.setAttribute('visible',false);return}
    this.el.setAttribute('visible',true);

    const duration=b.baseDuration/Math.max(.1,b.speed);
    const p=((t+b.phaseOffset)%duration)/duration;
    const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    const x=b.startX+(b.endX-b.startX)*e;
    const y=b.y+Math.sin((t+b.phaseOffset)*.0045)*.003;
    this.el.object3D.position.set(x,y,b.z);

    const wk=cfg.wake;
    if(t-this.lastWake>wk.interval){
      this.lastWake=t;
      this.spawnWake(x-wk.offsetX,y-wk.offsetY,wk.z);
    }
  },
  spawnWake(x,y,z){
    const cfg=window.ARCFG;if(!cfg||!this.wakeRoot)return;
    const wk=cfg.wake;
    const e=document.createElement('a-ellipse');
    e.setAttribute('position',`${x} ${y} ${z}`);
    e.setAttribute('radius-x',String(wk.rx));
    e.setAttribute('radius-y',String(wk.ry));
    e.setAttribute('material',`color:#e5fff8;transparent:true;opacity:${wk.opacity};side:double;shader:flat;depthWrite:false`);
    this.wakeRoot.appendChild(e);
    const born=performance.now(),life=wk.life,obj=e.object3D;
    const f=(now)=>{
      const q=(now-born)/life;
      if(q>=1){e.remove();return}
      obj.position.x-=wk.drift*q;
      obj.scale.set(1+q*wk.growX,1+q*wk.growY,1);
      const m=e.getObject3D('mesh');
      if(m?.material)m.material.opacity=wk.opacity*(1-q);
      requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  }
});
</script>
</head>

<body>
<div id="home">
  <div class="panel">
    <h1>AR 明信片即時調參 v9.6 iPhone船修正版</h1>
    <p>新增背景切換、第二艘船、每朵雲獨立 Z/大小/透明呼吸與更明顯船尾水紋。</p>
    <button id="startBtn">開始 AR 掃描</button>
  </div>
</div>

<div id="arRoot">
<a-scene id="arScene"
  mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart:false;"
  color-space="sRGB"
  renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  embedded>

<a-assets timeout="15000">
  <img id="backBridgeTex" src="./assets/backbridge.png">
  <img id="frontBridgeTex" src="./assets/front_bridge.png">
  <img id="cloud1Tex" src="./assets/cloud1.png">
  <img id="cloud2Tex" src="./assets/cloud2.png">
  <img id="cloud3Tex" src="./assets/cloud3.png">
  <img id="cloud4Tex" src="./assets/cloud4.png">
  <img id="bkTex" src="./assets/bk.png">
  <img id="waterTex" src="./assets/water.png">
  <video id="boatVideo" src="./assets/boat_alpha.webm" preload="auto" loop muted playsinline webkit-playsinline></video>
  <video id="boatVideoIOS" src="./assets/boat.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity id="target0" mindar-image-target="targetIndex:0">
  <a-entity id="sceneGroup">

    <a-plane id="basePlate"
      material="shader:soft-irregular-bg;color:#f3e6cf;opacity:.35;feather:.08;irregular:.05;textured:0;transparent:true;side:double;depthWrite:false">
    </a-plane>

    <a-plane id="blackBase"
      visible="false"
      material="shader:soft-irregular-bg;color:#111111;opacity:.45;feather:.08;irregular:.05;textured:0;transparent:true;side:double;depthWrite:false">
    </a-plane>

    <a-image id="bkLayer" src="#bkTex"
      visible="false"
      material="shader:soft-irregular-bg;src:#bkTex;opacity:.35;feather:.08;irregular:.05;textured:1;transparent:true;side:double;depthWrite:false">
    </a-image>

    <a-image id="backBridge" src="#backBridgeTex"
      material="transparent:true;opacity:1;side:double;shader:flat;depthWrite:false"></a-image>

    <a-image id="cloud1" src="#cloud1Tex" material="transparent:true;side:double;shader:flat;depthWrite:false" cloud-drift-fade="idx:1"></a-image>
    <a-image id="cloud2" src="#cloud2Tex" material="transparent:true;side:double;shader:flat;depthWrite:false" cloud-drift-fade="idx:2"></a-image>
    <a-image id="cloud3" src="#cloud3Tex" material="transparent:true;side:double;shader:flat;depthWrite:false" cloud-drift-fade="idx:3"></a-image>
    <a-image id="cloud4" src="#cloud4Tex" material="transparent:true;side:double;shader:flat;depthWrite:false" cloud-drift-fade="idx:4"></a-image>

    <a-entity id="wakeRoot1"></a-entity>
    <a-video id="boat1" src="#boatVideo"
      material="shader:video-grade;src:#boatVideo;brightness:1.25;contrast:1.75;opacity:1;transparent:true;side:double"
      boat-motion="idx:1"
      visible="false"></a-video>

    <a-entity id="wakeRoot2"></a-entity>
    <a-video id="boat2" src="#boatVideo"
      material="shader:video-grade;src:#boatVideo;brightness:1.1;contrast:1.5;opacity:1;transparent:true;side:double"
      boat-motion="idx:2"
      visible="false"></a-video>

    <a-image id="frontBridge" src="#frontBridgeTex"
      material="transparent:true;opacity:1;side:double;shader:flat;depthWrite:false"></a-image>

    <!-- Stable water layer: no custom shader -->
    <a-image id="waterLayer" src="#waterTex"
      visible="false"
      position="0 -0.10 0.105"
      material="shader:soft-irregular-water;src:#waterTex;opacity:.34;feather:.10;irregular:.035;transparent:true;side:double;depthWrite:false"
      water-gentle-motion>
    </a-image>
    <a-image id="textLayer" visible="true" live-text-anim
      material="transparent:true;opacity:1;side:double;shader:flat;depthWrite:false">
    </a-image>

    <a-image id="creditsLayer" visible="false" credits-scroll
      material="transparent:true;opacity:1;side:double;shader:flat;depthWrite:false">
    </a-image>

  </a-entity>
</a-entity>
</a-scene>
</div>

<div id="hud">
  <div id="status">尚未啟動</div>
  <div id="camInfo">Camera: 等待資訊…</div>
</div>
<div id="targetLoading" aria-label="載入中"><div class="spinner"></div></div>
<canvas id="textCanvas" width="1200" height="220" style="display:none"></canvas>
<canvas id="creditsCanvas" width="1200" height="900" style="display:none"></canvas>


<button id="tunerToggle">調整參數</button>
<button id="stopBtn">結束掃描</button>
<button id="explainBtn" type="button">看說明</button>
<div id="creditsOverlay">
  <div id="creditsOverlayInner">
    <div id="creditsOverlayText"></div>
  </div>
</div>

<div id="tuner">
  <div class="group">
    <h3>整體 / 背景</h3>
    <div class="row"><label>整體尺寸</label><input id="scale" type="range" min=".45" max=".82" step=".01"><span class="val" id="scaleV"></span></div>
    <div class="row"><label>整體 Z</label><input id="sceneZ" type="range" min="0" max=".07" step=".001"><span class="val" id="sceneZV"></span></div>

    <div class="checkboxRow"><input id="useWhiteBase" type="checkbox" checked><label for="useWhiteBase">使用白色底層</label></div>
    <div class="row"><label>白底透明度</label><input id="baseOpacity" type="range" min="0" max=".60" step=".01"><span class="val" id="baseOpacityV"></span></div>
    <div class="row"><label>白底 Z</label><input id="baseZ" type="range" min="0" max=".03" step=".001"><span class="val" id="baseZV"></span></div>
    <div class="row"><label>白底大小</label><input id="baseScale" type="range" min=".5" max="1.4" step=".02"><span class="val" id="baseScaleV"></span></div>
    <div class="checkboxRow"><input id="useBlackBase" type="checkbox"><label for="useBlackBase">使用黑色底層</label></div>
    <div class="row"><label>黑底透明度</label><input id="blackOpacity" type="range" min="0" max=".90" step=".01"><span class="val" id="blackOpacityV"></span></div>
    <div class="row"><label>黑底 Z</label><input id="blackZ" type="range" min="0" max=".05" step=".001"><span class="val" id="blackZV"></span></div>
    <div class="row"><label>黑底大小</label><input id="blackScale" type="range" min=".5" max="1.6" step=".02"><span class="val" id="blackScaleV"></span></div>

    <div class="checkboxRow"><input id="useBk" type="checkbox"><label for="useBk">使用 bk.png 自訂背景</label></div>
    <div class="row"><label>BK透明度</label><input id="bkOpacity" type="range" min="0" max="1" step=".02"><span class="val" id="bkOpacityV"></span></div>
    <div class="row"><label>BK Z</label><input id="bkZ" type="range" min="0" max=".03" step=".001"><span class="val" id="bkZV"></span></div>
    <div class="row"><label>BK大小</label><input id="bkScale" type="range" min=".5" max="1.4" step=".02"><span class="val" id="bkScaleV"></span></div>
    <div class="checkboxRow"><input id="softBg" type="checkbox" checked><label for="softBg">背景不規則柔邊</label></div>
    <div class="row"><label>柔邊範圍</label><input id="bgFeather" type="range" min="0" max=".20" step=".005"><span class="val" id="bgFeatherV"></span></div>
    <div class="row"><label>邊緣不規則</label><input id="bgIrregular" type="range" min="0" max=".12" step=".005"><span class="val" id="bgIrregularV"></span></div>
  </div>

function getCanvasFont(fontKey,size,weight=700){
  const families={
    kai:`"DFKai-SB","BiauKai","Kaiti TC","KaiTi","STKaiti","Noto Serif TC",serif`,
    ming:`"PMingLiU","MingLiU","Songti TC","STSong","Noto Serif TC",serif`,
    song:`"Songti TC","STSong","SimSun","Noto Serif TC",serif`,
    serif:`"Noto Serif TC","PMingLiU","Songti TC","Times New Roman",serif`,
    sans:`"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC","Arial",sans-serif`,
    rounded:`"Arial Rounded MT Bold","PingFang TC","Noto Sans TC",sans-serif`,
    hand:`"DFKai-SB","BiauKai","Kaiti TC","KaiTi","STKaiti",cursive`,
    mono:`"SFMono-Regular","Consolas","Courier New","Noto Sans Mono CJK TC",monospace`,
    thin:`"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`,
    system:`system-ui,-apple-system,"BlinkMacSystemFont","Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif`
  };
  const effectiveWeight=(fontKey==='thin')?300:weight;
  return `${effectiveWeight} ${size}px ${families[fontKey]||families.kai}`;
}
function renderTextTexture(opts={}){
  const c=ARCFG.text;
  const displayText=(opts.text!==undefined)?opts.text:(c.value||'');
  const shimmer=opts.shimmer||0;
  textCtx.clearRect(0,0,textCanvas.width,textCanvas.height);
  textCtx.textAlign='center'; textCtx.textBaseline='middle';
  textCtx.font=getCanvasFont(c.font,c.size,c.weight);
  textCtx.shadowColor='rgba(0,0,0,.16)'; textCtx.shadowBlur=3; textCtx.shadowOffsetY=1;
  if(c.stroke){
    textCtx.lineWidth=c.strokeWidth||2;
    textCtx.strokeStyle=c.strokeColor||'#f5e7c8';
    textCtx.strokeText(displayText,textCanvas.width/2,textCanvas.height/2);
  }
  if(c.anim==='shimmer' && shimmer>0){
    const g=textCtx.createLinearGradient(250,0,950,0);
    const p=Math.max(0.02,Math.min(.98,shimmer));
    g.addColorStop(Math.max(0,p-.18),c.color); g.addColorStop(p,'#fff3c8'); g.addColorStop(Math.min(1,p+.18),c.color);
    textCtx.fillStyle=g;
  }else textCtx.fillStyle=c.color;
  textCtx.fillText(displayText,textCanvas.width/2,textCanvas.height/2);
  textLayer.setAttribute('src',textCanvas.toDataURL('image/png'));
  const metrics=textCtx.measureText(displayText||' ');
  const pxW=Math.max(180,Math.min(1120,metrics.width+100));
  const worldW=Math.max(.10,Math.min(.62,pxW/1800));
  const worldH=worldW*(textCanvas.height/textCanvas.width);
  textLayer.setAttribute('width',worldW); textLayer.setAttribute('height',worldH);
}

function hexToRgba(hex,a){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function getCreditsFont(fontKey,size){
  const families={
    kai:`"DFKai-SB","BiauKai","Kaiti TC","KaiTi","STKaiti","Noto Serif TC",serif`,
    ming:`"PMingLiU","MingLiU","Songti TC","STSong","Noto Serif TC",serif`,
    song:`"Songti TC","STSong","SimSun","Noto Serif TC",serif`,
    serif:`"Noto Serif TC","PMingLiU","Songti TC",serif`,
    sans:`"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif`,
    rounded:`"Arial Rounded MT Bold","PingFang TC","Noto Sans TC",sans-serif`,
    hand:`"DFKai-SB","BiauKai","Kaiti TC","KaiTi","STKaiti",cursive`,
    mono:`"SFMono-Regular","Consolas","Courier New",monospace`,
    thin:`"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`,
    system:`system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif`
  };
  return `500 ${size}px ${families[fontKey]||families.ming}`;
}

function wrapCreditsText(ctx,text,maxWidth){
  const paragraphs=String(text||'').split(/\n/);
  const lines=[];
  for(const para of paragraphs){
    if(!para){lines.push('');continue}
    let line='';
    for(const ch of para){
      const test=line+ch;
      if(ctx.measureText(test).width>maxWidth && line){
        lines.push(line); line=ch;
      }else line=test;
    }
    if(line) lines.push(line);
  }
  return lines;
}

function renderCreditsTexture(scrollPx=0){
  const c=ARCFG.credits;
  const W=creditsCanvas.width,H=creditsCanvas.height;
  creditsCtx.clearRect(0,0,W,H);

  // configurable translucent frame
  if(c.bgOpacity>0){
    creditsCtx.fillStyle=hexToRgba(c.bgColor,c.bgOpacity);
    creditsCtx.fillRect(0,0,W,H);
  }

  const pad=72;
  creditsCtx.font=getCreditsFont(c.font,c.size);
  creditsCtx.textAlign='left';
  creditsCtx.textBaseline='top';
  creditsCtx.fillStyle=hexToRgba(c.color,c.opacity);
  const lines=wrapCreditsText(creditsCtx,c.value,W-pad*2);
  const lineH=c.size*1.55;
  const totalH=lines.length*lineH;
  let y=H-scrollPx;

  for(const line of lines){
    creditsCtx.fillText(line,pad,y);
    y+=lineH;
  }

  creditsLayer.setAttribute('src',creditsCanvas.toDataURL('image/png'));
  creditsLayer.setAttribute('width',c.w);
  creditsLayer.setAttribute('height',c.h);
  return totalH+H;
}

AFRAME.registerComponent('credits-scroll',{
  init(){
    this.start=performance.now();
    this.lastDraw=0;
    this.totalScroll=1800;
  },
  tick(t){
    const c=ARCFG?.credits;
    if(!c || !c.enabled){this.el.setAttribute('visible',false);return}
    this.el.setAttribute('visible',true);
    this.el.object3D.position.set(c.x,c.y,c.z);

    if(t-this.lastDraw<85)return;
    this.lastDraw=t;

    const elapsed=(t-this.start)*0.001;
    let scroll=elapsed*(90*c.speed);
    if(c.loop && this.totalScroll>0) scroll%=this.totalScroll;
    else scroll=Math.min(scroll,this.totalScroll);

    this.totalScroll=renderCreditsTexture(scroll);
  }
});

AFRAME.registerComponent('live-text-anim',{
  init(){this.lastTextureUpdate=0;this.lastMode='';this.typeStart=performance.now()},
  tick(t){
    const c=ARCFG?.text;if(!c||!c.enabled)return;
    if(this.lastMode!==c.anim){this.lastMode=c.anim;this.typeStart=t;renderTextTexture()}
    let x=c.x,y=c.y,z=c.z,scale=1,opacity=1;
    if(c.anim==='float'){y+=Math.sin(t*.0018*c.animSpeed)*c.animAmp;x+=Math.cos(t*.0012*c.animSpeed)*c.animAmp*.25}
    else if(c.anim==='breathe'){scale=1+Math.sin(t*.002*c.animSpeed)*(c.animAmp*2.4)}
    else if(c.anim==='fade'){opacity=.58+.42*(Math.sin(t*.002*c.animSpeed)*.5+.5)}
    else if(c.anim==='typewriter'){
      if(t-this.lastTextureUpdate>90){this.lastTextureUpdate=t;const full=c.value||'';const elapsed=(t-this.typeStart)*.001*c.animSpeed;const count=Math.floor(elapsed*5)%(full.length+8);renderTextTexture({text:full.slice(0,Math.min(full.length,count))})}
    }else if(c.anim==='shimmer'){
      if(t-this.lastTextureUpdate>90){this.lastTextureUpdate=t;renderTextTexture({shimmer:(Math.sin(t*.0015*c.animSpeed)*.5+.5)})}
    }
    this.el.object3D.position.set(x,y,z);this.el.object3D.scale.set(scale,scale,1);
    const mesh=this.el.getObject3D('mesh');if(mesh?.material){mesh.material.transparent=true;mesh.material.opacity=opacity}
  }
});

function syncCreditsOverlayStyle(){
  const c=ARCFG.credits;
  creditsOverlay.style.height=Math.max(110,Math.min(420,c.h*700))+'px';
  creditsOverlay.style.background=hexToRgba(c.bgColor,c.bgOpacity);
  creditsOverlayText.style.color=hexToRgba(c.color,c.opacity);
  creditsOverlayText.style.font=getCreditsFont(c.font,Math.max(18,Math.min(46,c.size*.55)));
  creditsOverlayText.textContent=c.value||'';
}
function animateCreditsOverlay(ts){
  if(!creditsOverlayOpen)return;
  const c=ARCFG.credits;
  if(!creditsOverlayStart)creditsOverlayStart=ts;
  const elapsed=(ts-creditsOverlayStart)/1000;
  const speedPx=18+c.speed*42;
  const innerH=creditsOverlay.clientHeight||220;
  const textH=creditsOverlayText.scrollHeight||300;
  const travel=textH+innerH;
  let y=innerH-((elapsed*speedPx)%Math.max(1,travel));
  if(!c.loop)y=Math.max(-textH,y);
  creditsOverlayText.style.transform=`translateY(${y}px)`;
  creditsOverlayRAF=requestAnimationFrame(animateCreditsOverlay);
}
function openCreditsOverlay(){
  creditsOverlayOpen=true;
  creditsOverlayStart=0;
  syncCreditsOverlayStyle();
  creditsOverlay.classList.add('show');
  explainBtn.textContent='關閉說明';
  if(creditsOverlayRAF)cancelAnimationFrame(creditsOverlayRAF);
  creditsOverlayRAF=requestAnimationFrame(animateCreditsOverlay);
}
function closeCreditsOverlay(){
  creditsOverlayOpen=false;
  creditsOverlay.classList.remove('show');
  explainBtn.textContent='看說明';
  if(creditsOverlayRAF){cancelAnimationFrame(creditsOverlayRAF);creditsOverlayRAF=null;}
}

function bindRange(id,getter,setter,decimals=3){
  const el=document.getElementById(id),out=document.getElementById(id+'V');
  el.value=getter(); out.textContent=Number(getter()).toFixed(decimals);
  el.addEventListener('input',()=>{setter(+el.value);out.textContent=Number(el.value).toFixed(decimals);applyAll()});
}

scene.addEventListener('loaded',()=>ready=true);
const getMindAR=()=>scene.systems&&scene.systems['mindar-image-system'];

function waitMindAR(timeout=8000){
  return new Promise((resolve,reject)=>{
    const t0=Date.now();
    const i=setInterval(()=>{
      const s=getMindAR();
      if(s){clearInterval(i);resolve(s)}
      else if(Date.now()-t0>timeout){clearInterval(i);reject(new Error('MindAR timeout'))}
    },100)
  })
}

async function unlockVideo(){
  const videos=isIOS?[boatVideoIOS,boatVideo]:[boatVideo,boatVideoIOS];
  for(const v of videos){
    try{
      await v.play();
      v.pause();
      v.currentTime=0;
    }catch(e){}
  }
}

function updateCameraInfo(){
  const cam=[...document.querySelectorAll('video')].find(v=>v!==boatVideo&&v!==boatVideoIOS&&v.srcObject);
  if(!cam){camInfo.textContent='Camera: 尚未取得串流';return}
  const tr=cam.srcObject.getVideoTracks()[0],s=tr.getSettings?.()||{};
  camInfo.textContent=`Camera: ${cam.videoWidth||s.width||'?'}×${cam.videoHeight||s.height||'?'} @ ${Math.round(s.frameRate||0)||'?'}fps · Boat:${isIOS?'iOS MP4 key':'WebM alpha'}`;
}

async function startAR(){
  if(starting||running)return;
  starting=true;document.body.classList.add('scanning');
  status.textContent='正在啟動高解析度後鏡頭…';
  try{
    await unlockVideo();
    if(!ready&&!scene.hasLoaded)await new Promise(r=>scene.addEventListener('loaded',r,{once:true}));
    const sys=await waitMindAR();await sys.start();
    running=true;status.textContent='相機已開啟，請對準明信片';
    timer=setInterval(updateCameraInfo,500);setTimeout(updateCameraInfo,500);
  }catch(e){
    console.error(e);document.body.classList.remove('scanning');
    alert('相機啟動失敗，請確認 HTTPS 與相機權限。');
  }finally{starting=false}
}

async function stopAR(){
  clearInterval(timer);
  try{
    boatVideo.pause();boatVideoIOS.pause();boat1.setAttribute('visible',false);boat2.setAttribute('visible',false);
    const sys=getMindAR();if(sys&&running)await sys.stop();
  }catch(e){}
  closeCreditsOverlay();
  running=false;document.body.classList.remove('scanning');
}

    hideTargetLoading();
    status.textContent='辨識成功 ✓ 可直接調參';
  },450)));
});
target.addEventListener('targetLost',()=>{

  status.textContent='失去 target，請重新對準';
  boat1.setAttribute('visible',false);boat2.setAttribute('visible',false);boatVideo.pause();boatVideoIOS.pause();
});
